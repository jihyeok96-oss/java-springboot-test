# 1번. application.yml - 평가문항의 PostgreSQL 접속값과 JPA/Thymeleaf 설정
# 참고: spring-practice-ans 및 java-springboot-test의 spring.datasource 설정 방식.
# https://github.com/jihyeok96-oss/spring-practice-ans/blob/master/src/main/resources/application.yaml
# [평가문항에 맞춘 변경] 사용자명은 TEST.md에 적힌 postgress(끝에 s 두 개)를 그대로 사용한다.
# 로컬 PostgreSQL에도 postgress 사용자와 company DB가 준비되어 있어야 한다.
spring:
  application:
    name: board
  datasource:
    url: jdbc:postgresql://localhost:5432/company
    username: postgres
    password: 1004
    driver-class-name: org.postgresql.Driver
  jpa:
    # 1번: JPA가 Entity 기준으로 필요한 테이블/컬럼을 갱신한다.
    # 수업 예제의 update 설정이며 기존 데이터 삭제를 위한 create/create-drop을 사용하지 않는다.
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # [수업 예제 외 추가] DB에서 읽은 시간도 서울 오프셋으로 일관되게 처리한다.
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false
  thymeleaf:
    # 6번: 수업 예제처럼 HTML 변경을 개발 중 바로 확인한다.
    cache: false
