<!DOCTYPE html>
<!--
    [문항 10] 파일: templates/error/400.html
    목적: 잘못된 id 형식/요청에 대해 HTTP 400 상태와 읽기 쉬운 오류 안내를 제공한다.
    수업 참고: mvclab / templates/error/404.html의 상태번호, 안내문, 목록 복귀 링크 구성.
    https://github.com/jihyeok96-oss/mvclab/blob/main/src/main/resources/templates/error/404.html
    [수업 예제 외 추가] 위 404 화면 구성을 400 Bad Request 화면에도 적용했다.
    ControllerAdvice가 전달한 message는 th:text로 안전하게 출력한다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잘못된 요청 - 게시판</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <nav class="container navigation" aria-label="주 메뉴"><a class="brand" th:href="@{/boards}">게시판</a></nav>
</header>
<main class="container main-content error-card">
    <section class="card error-message">
        <p class="error-code">400</p>
        <h1>요청을 확인해 주세요.</h1>
        <p class="subtitle" th:text="${message != null ? message : '입력 값이나 게시글 번호가 올바르지 않습니다.'}">
            입력 값이나 게시글 번호가 올바르지 않습니다.
        </p>
        <a class="btn btn-primary" th:href="@{/boards}">게시글 목록으로</a>
    </section>
</main>
<footer class="site-footer"><p>게시판 · 서로의 생각을 나누는 공간</p></footer>
</body>
</html>
