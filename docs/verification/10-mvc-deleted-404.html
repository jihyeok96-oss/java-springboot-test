<!DOCTYPE html>
<!--
    [문항 5, 10] 파일: templates/error/404.html
    목적: 존재하지 않는 id 조회/수정/삭제 시 HTTP 404 화면을 표시한다.
    수업 참고: mvclab / templates/error/404.html의 상태번호, 안내문, 목록 복귀 링크.
    https://github.com/jihyeok96-oss/mvclab/blob/main/src/main/resources/templates/error/404.html
    Service에서 발생시킨 예외를 ControllerAdvice가 처리하여 이 템플릿과 message를 반환한다.
    message가 없는 기본 오류 요청에도 안내문을 표시하도록 기본 문자열을 둔다.
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글을 찾을 수 없습니다 - 게시판</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <nav class="container navigation" aria-label="주 메뉴"><a class="brand" href="/boards">게시판</a></nav>
</header>
<main class="container main-content error-card">
    <section class="card error-message">
        <p class="error-code">404</p>
        <h1>게시글을 찾을 수 없습니다.</h1>
        <p class="subtitle">3번 게시글을 찾을 수 없습니다.</p>
        <a class="btn btn-primary" href="/boards">게시글 목록으로</a>
    </section>
</main>
<footer class="site-footer"><p>게시판 · 서로의 생각을 나누는 공간</p></footer>
</body>
</html>
